version: 2
updates:
  # Keep GitHub Actions themselves up to date. Stack-agnostic; leave this in.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint does not yet accept TypeScript 7 as a peer.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
